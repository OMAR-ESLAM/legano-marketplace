<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>الإشعارات | Legano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Syne:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js/social.css">
<style>
  :root { color-scheme: light; --background:#F8FAFB; --foreground:#1E293B; --card:#FFFFFF; --border:#E2E8F0; --muted-foreground:#64748B; --secondary:#EEF2F7; --gold:#0F172A; --gold-soft:#92620C; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--background); color: var(--foreground); line-height: 1.7; }
  .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 18px; text-decoration: none; background: linear-gradient(90deg, #0F172A, #92620C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .top { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  #navSlot { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 17px; margin: 18px 0 12px; font-weight: 900; }
  .list { overflow: hidden; }
</style>
</head>
<body>
<header class="top"><a class="logo-text" href="index.html">LEGANO</a><div id="navSlot"></div></header>
<main class="soc-wrap">
  <h1>الإشعارات</h1>
  <div id="box" class="soc-card list" aria-live="polite"></div>
</main>
<script src="js/social.js"></script>
<script>
(async () => {
  const S = window.Social, box = document.getElementById('box'), esc = S.esc;
  S.mountNav(document.getElementById('navSlot'));
  if (!S.me()) { box.innerHTML = '<div class="empty" style="border:0">سجّل دخول علشان تشوف إشعاراتك.<br><a class="soc-btn primary" style="margin-top:10px" href="dashboard.html">دخول المحامين</a></div>'; return; }
  box.innerHTML = '<div class="empty" style="border:0">بنحمّل الإشعارات…</div>';
  const ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#92620C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 1.8 3-.1.9 2.900 2.400 1.800-.9 2.900.9 2.900-2.400 1.800-.9 2.900-3-.1L12 22l-2.400-1.800-3 .1-.9-2.900L3.300 15.600l.9-2.900-.9-2.900L5.700 8l.9-2.900 3 .1z"/><path d="M8.500 12l2.500 2.500 4.500-5"/></svg>';
  try {
    const d = await S.listNotifications();
    if (!d.rows.length) { box.innerHTML = '<div class="empty" style="border:0">مفيش إشعارات لسه. لما حد يتابعك أو يعلّق على منشورك هتلاقيه هنا.</div>'; return; }
    box.innerHTML = d.rows.map(n => {
      const a = d.authors[n.actor_id];
      const who = a ? `<b>${esc(a.display_name)}</b>${a.verified ? S.badge() : ''}` : '<b>محامي</b>';
      let txt, href, lead = a ? S.avatar(a) : `<span class="n-ico">${ICON}</span>`;
      if (n.type === 'follow') { txt = `${who} بدأ يتابعك.`; href = a ? `lawyer.html?id=${esc(a.id)}` : '#'; }
      else if (n.type === 'like') { txt = `${who} أعجبه منشورك.`; href = `feed.html?post=${esc(n.post_id)}`; }
      else if (n.type === 'comment') { txt = `${who} علّق على منشورك.`; href = `feed.html?post=${esc(n.post_id)}`; }
      else if (n.type === 'verified') { txt = 'تم توثيق حسابك. العلامة الزرقاء ظهرت جنب اسمك.'; href = 'dashboard.html'; lead = `<span class="n-ico">${ICON}</span>`; }
      else { txt = 'طلب التوثيق اتراجع واترفض. تقدر تبعته تاني من لوحتك.'; href = 'dashboard.html'; lead = `<span class="n-ico">${ICON}</span>`; }
      const snip = n.post_id && d.posts[n.post_id] ? `<span class="n-snip">${esc(d.posts[n.post_id].slice(0, 90))}</span>` : '';
      return `<a class="n-item ${n.read ? '' : 'unread'}" href="${href}">${lead}<div class="n-txt">${txt}${snip}<span class="n-time">${S.ago(n.created_at)}</span></div></a>`;
    }).join('');
    // نعلّم الكل مقروء بعد ما الصفحة تتعرض (الإشعارات الجديدة فضلت مظللة في العرض ده)
    if (d.rows.some(n => !n.read)) S.markAllRead().then(() => { const dot = document.querySelector('.nav-dot'); if (dot) dot.hidden = true; }).catch(() => {});
  } catch (e) { box.innerHTML = `<div class="empty" style="border:0">${esc(S.friendly(e))}</div>`; }
})();
</script>
</body>
</html>
