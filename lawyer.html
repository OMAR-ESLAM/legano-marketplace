<head>
<meta charset="UTF-8">

<title>بروفايل المحامي | Legano</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --background: #F8FAFB;
    --foreground: #1E293B;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --muted-foreground: #64748B;
    --secondary: #EEF2F7;
    --secondary-foreground: #1E293B;
    --primary-foreground: #FFFFFF;
    --gold: #0F172A;
    --gold-soft: #92620C;
    --radius: 0.75rem;
  }
  .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: 5px; background: linear-gradient(90deg, #0F172A, #92620C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .badge-featured { background: #B8860B; color: #fff; }
  .btn-ghost-link { border: 1px solid var(--border); background: var(--card); color: var(--foreground); border-radius: 8px; padding: .45rem .9rem; font-size: .75rem; font-weight: 700; }
  .btn-ghost-link:hover { border-color: var(--gold-soft); }
  body { font-family: 'Cairo', sans-serif; background: var(--background); color: var(--foreground); }
  .bg-app { background: var(--background); }
  .bg-card-c { background: var(--card); }
  .bg-secondary-c { background: var(--secondary); }
  .bg-gold-c { background: var(--gold); }
  .text-fg { color: var(--foreground); }
  .text-muted-c { color: var(--muted-foreground); }
  .text-gold-c { color: var(--gold); }
  .text-gold-soft-c { color: var(--gold-soft); }
  .text-secondary-fg-c { color: var(--secondary-foreground); }
  .text-primary-fg-c { color: var(--primary-foreground); }
  .border-app { border-color: var(--border); }
  [data-lucide] { width: 1em; height: 1em; }
  ::placeholder { color: var(--muted-foreground); opacity: .8; }
  .lawyer-card { transition: border-color .3s ease; }
  .chip-active { background: var(--gold); color: var(--primary-foreground); }
  .chip-inactive { background: color-mix(in oklch, var(--card) 60%, transparent); border: 1px solid var(--border); color: color-mix(in oklch, var(--foreground) 80%, transparent); }
  .chip-inactive:hover { border-color: color-mix(in oklch, var(--gold) 40%, transparent); }
  .modal-overlay { backdrop-filter: blur(4px); }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Wave background */
  .wave-band { position: absolute; inset-inline: 0; top: 10%; height: 42%; overflow: hidden; pointer-events: none; }
  .wave-bob { position: absolute; inset: -20% 0; animation: waveBob 7s ease-in-out infinite; }
  .wave-track { position: absolute; top: 0; right: 0; height: 100%; width: 200%; display: flex; animation: waveScroll 22s linear infinite; }
  .wave-track svg { height: 100%; width: 50%; flex-shrink: 0; }
  @keyframes waveScroll {
    from { transform: translateX(0); }
    to { transform: translateX(50%); }
  }
  @keyframes waveBob {
    0%   { transform: translateY(0) scaleY(1); }
    25%  { transform: translateY(-10px) scaleY(1.06); }
    50%  { transform: translateY(4px) scaleY(0.96); }
    75%  { transform: translateY(-6px) scaleY(1.03); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave-track, .wave-bob { animation: none; }
  }

  /* Stardust / glitter cascading down behind headline */
  .stardust { position: absolute; inset-inline: 0; top: 0; height: 50%; overflow: hidden; pointer-events: none; }
  .dust-dot {
    position: absolute; border-radius: 9999px;
    animation: dustFall var(--fall-dur) ease-in infinite;
    animation-delay: var(--delay);
    box-shadow: 0 0 var(--blur) currentColor, 0 0 calc(var(--blur) * 2) currentColor;
    opacity: 0;
  }
  @keyframes dustFall {
    0%   { opacity: 0; transform: translateY(-14px) scale(0.6); }
    12%  { opacity: var(--op-max); transform: translateY(0) scale(1); }
    70%  { opacity: var(--op-max); transform: translateY(calc(var(--drift) * 0.7)) scale(1); }
    100% { opacity: 0; transform: translateY(var(--drift)) scale(0.7); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dust-dot { animation: none; opacity: var(--op-max); }
  }

  .glass { border:1px solid var(--border); background:var(--card); box-shadow:0 8px 30px rgba(15,23,42,.06); }
  .tab-btn { padding:.55rem 1rem; border-radius:9999px; font-size:.8rem; font-weight:700; border:1px solid var(--border); background:color-mix(in oklch, var(--card) 60%, transparent); color:color-mix(in oklch, var(--foreground) 80%, transparent); transition:border-color .2s; cursor:pointer; }
  .tab-btn:hover { border-color:color-mix(in oklch, var(--gold) 40%, transparent); }
  .tab-btn[aria-selected="true"] { background:var(--gold); color:var(--primary-foreground); border-color:var(--gold); }
  .btn-main { display:flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; padding:.8rem 1rem; font-weight:800; font-size:.9rem; transition:filter .2s, transform .1s; cursor:pointer; border:0; }
  .btn-main:hover { filter:brightness(1.08); } .btn-main:active { transform:scale(.98); }
  .btn-call { background:var(--gold); color:var(--primary-foreground); }
  .btn-wa { background:#1fa855; color:#fff; }
  .btn-ghost { border:1px solid var(--border); background:color-mix(in oklch, var(--card) 60%, transparent); color:var(--foreground); }
  .btn-ghost:hover { border-color:color-mix(in oklch, var(--gold) 45%, transparent); }
  .stat { border:1px solid var(--border); background:color-mix(in oklch, var(--card) 60%, transparent); border-radius:.75rem; padding:.7rem .5rem; text-align:center; }
  .toast { position:fixed; bottom:5.5rem; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:var(--gold); color:var(--primary-foreground); font-weight:700; font-size:.85rem; padding:.55rem 1.1rem; border-radius:9999px; transition:all .25s; z-index:60; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .fav-on { color:var(--gold); } .fav-on svg { fill: currentColor; }
  .reveal-in { animation: revealIn .25s ease; } @keyframes revealIn { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none; } }
  @media (min-width:768px){ .sticky-bar{display:none;} }
</style>
