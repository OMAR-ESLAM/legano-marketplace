<style>

  body { margin: 0; font-family: 'Cairo', sans-serif; background: #0B1220; color: #fff; line-height: 1.7; overflow-x: hidden; }
  .top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: rgba(11,18,32,.88); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.1); }

  .hello { padding: 16px 18px 6px; } .hello h1 { margin: 0; font-size: 1.35rem; font-weight: 900; } .hello p { margin: 2px 0 0; color: #94a3b8; font-size: .88rem; }
  .scene { position: relative; margin: 8px 10px 0; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); background: #1a2540; }
  .scene svg { display: block; width: 100%; height: auto; }
  .hs { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  .hs .lift { transition: transform .18s ease; transform-box: fill-box; transform-origin: center bottom; }
  .hs:hover .lift, .hs:focus-visible .lift, .hs:active .lift { transform: translateY(-3px) scale(1.04); }
  .hs:focus-visible .ring, .hs:hover .ring { opacity: 1; }
  .ring { fill: none; stroke: #fcd34d; stroke-width: 2; stroke-dasharray: 5 4; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .lbl { font: 800 11.5px 'Cairo', sans-serif; fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px; text-anchor: middle; pointer-events: none; }
  .bd { opacity: 0; transform: scale(.4); transform-box: fill-box; transform-origin: center; transition: .3s cubic-bezier(.2,1.6,.4,1); pointer-events: none; } .bd.on { opacity: 1; transform: none; }
  .bd circle { fill: #ef4444; stroke: #fff; stroke-width: 1.5; } .bd text { font: 900 11px 'Cairo', sans-serif; fill: #fff; text-anchor: middle; }
  .ring-phone.on { animation: shake .55s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(5deg); } }
  .glow { animation: glow 3s ease-in-out infinite; } @keyframes glow { 50% { opacity: .65; } }
  .dust circle { animation: float 7s ease-in-out infinite; } @keyframes float { 50% { transform: translateY(-14px); opacity: .15; } }
  .status { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 14px 10px 0; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); font-size: 12.5px; font-weight: 800; color: #e2e8f0; text-decoration: none; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; } .chip.on i { background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.7); animation: pl 1.8s infinite; } @keyframes pl { 70% { box-shadow: 0 0 0 9px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .gate { margin: 40px 16px; padding: 24px; border-radius: 18px; background: rgba(255,255,255,.08); text-align: center; } .gate a { color: #fcd34d; font-weight: 800; }

  #door { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0B1220; overflow: hidden; }
  #door .pn { position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #4a2c17, #6b4021 50%, #4a2c17); box-shadow: inset 0 0 0 10px rgba(0,0,0,.18), inset 0 0 0 12px rgba(252,211,77,.22); transition: transform 1.3s cubic-bezier(.65,.05,.25,1); }
  #door .pn.l { left: 0; border-right: 2px solid #1a0f08; } #door .pn.r { right: 0; border-left: 2px solid #1a0f08; }
  #door .pn::after { content: ''; position: absolute; top: 50%; width: 12px; height: 56px; margin-top: -28px; border-radius: 6px; background: linear-gradient(#fde68a, #b7791f); } #door .pn.l::after { right: 16px; } #door .pn.r::after { left: 16px; }
  #door.open .pn.l { transform: translateX(-102%); } #door.open .pn.r { transform: translateX(102%); }
  #door .plate { position: relative; z-index: 2; text-align: center; padding: 14px 26px; border-radius: 14px; background: linear-gradient(145deg, #fde68a, #b7791f); color: #2a1a05; box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: opacity .5s, transform .5s; }
  #door .plate small { display: block; font-size: 12px; font-weight: 800; opacity: .8; } #door .plate b { font-size: 1.25rem; font-weight: 900; }
  #door.open .plate { opacity: 0; transform: scale(.9); }
  #door.gone { display: none; }
  .skip { position: absolute; z-index: 3; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: #94a3b8; font-weight: 700; }
  .pill { fill: rgba(11,18,32,.72); stroke: rgba(252,211,77,.35); stroke-width: .8; pointer-events: none; }
  .lbl { stroke: none !important; font-size: 11px; }
  #sheet { position: fixed; inset: 0; z-index: 90; visibility: hidden; } #sheet.on { visibility: visible; }
  #sheet .ov { position: absolute; inset: 0; background: rgba(5,9,18,.6); opacity: 0; transition: opacity .25s; } #sheet.on .ov { opacity: 1; }
  #sheet .pn { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 82vh; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; background: #fff; color: #1E293B; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1); box-shadow: 0 -12px 40px rgba(0,0,0,.4); }
  #sheet.on .pn { transform: none; }
  .sh-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid #E2E8F0; } .sh-h h2 { margin: 0; font-size: 1.1rem; font-weight: 900; }

  #sBody { padding: 12px 18px 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .sh-r b { display: block; font-size: 14px; font-weight: 800; } .sh-r small { display: block; color: #64748B; font-size: 12px; line-height: 1.6; } .sh-r .am { font-weight: 900; color: #166534; white-space: nowrap; font-size: 13px; }
  .sh-e { padding: 24px 6px; text-align: center; color: #64748B; font-size: 13.5px; line-height: 1.9; }
  .sh-n { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 10px; } .sh-n div { background: #F1F5F9; border-radius: 12px; padding: 10px 12px; } .sh-n small { display: block; color: #64748B; font-size: 12px; } .sh-n b { font-size: 1.25rem; font-weight: 900; }
  .sh-b { border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; background: #0F172A; color: #fff; } .sh-b.g { background: #EEF2F7; color: #334155; } .sh-b.ok { background: #16a34a; }

  .sh-sw input { width: 22px; height: 22px; accent-color: #16a34a; }
  @media (prefers-reduced-motion: reduce) { #door .pn, #door .plate { transition-duration: .01s; } .ring-phone.on, .glow, .dust circle, .chip.on i { animation: none; } }

        <a class="hs" href="feed.html" id="hDoor" aria-label="اخرج للسوق"><g class="lift"><rect x="22" y="478" width="76" height="132" rx="4" fill="#5e3a1a"/><rect x="30" y="486" width="60" height="116" rx="2" fill="#7a4d24"/><rect x="38" y="496" width="44" height="40" rx="2" fill="#00000026"/><rect x="38" y="544" width="44" height="50" rx="2" fill="#00000026"/><circle cx="80" cy="548" r="4" fill="#fcd34d"/></g><rect class="ring" x="17" y="473" width="86" height="142" rx="6"/><text class="lbl" x="60" y="628">اخرج للسوق</text></a>

                <g class="dust" fill="#fde68a" opacity=".5"><circle cx="150" cy="300" r="1.6"/><circle cx="240" cy="270" r="1.2" style="animation-delay:-2s"/><circle cx="60" cy="330" r="1.4" style="animation-delay:-4s"/><circle cx="330" cy="300" r="1.3" style="animation-delay:-1s"/></g>
        <rect id="dim" width="380" height="640" fill="#0b1220" opacity="0" pointer-events="none"/>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle"><div class="ov" id="sOv"></div><div class="pn"><div class="sh-h"><h2 id="sTitle"></h2><button class="sh-x" id="sX" type="button" aria-label="إغلاق">×</button></div><div id="sBody"></div><div class="sh-f" id="sF"><a id="sLink" href="#">افتح الصفحة كاملة</a></div></div></div>
<div id="door" aria-live="polite"><div class="pn l"></div><div class="pn r"></div><div class="plate"><small>مكتب</small><b id="doorName">الأستاذ</b></div><div class="skip">اضغط في أي مكان للدخول</div></div>
<script src="js/social.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id), S = window.Social, C = S.Consult, esc = S.esc, NS = 'http://www.w3.org/2000/svg';
  const door = $('door');
  const skipIntro = (() => { try { return sessionStorage.getItem('lg_office') === '1'; } catch { return false; } })();
  if (!S.me()) { door.classList.add('gone'); $('gate').hidden = false; return; }
  $('office').hidden = false;
  S.mountNav($('navSlot'));

  // الوقت: لون السما والإضاءة
  const hr = new Date().getHours(), night = hr >= 19 || hr < 5, dusk = (hr >= 17 && hr < 19) || (hr >= 5 && hr < 7);
  $('sk1').setAttribute('stop-color', night ? '#0b1220' : dusk ? '#f59e0b' : '#7cc0ff'); $('sk2').setAttribute('stop-color', night ? '#1b2848' : dusk ? '#fde68a' : '#d9efff');
  $('stars').setAttribute('opacity', night ? 1 : 0); $('sun').setAttribute('opacity', night ? 0 : 1);
  $('dim').setAttribute('opacity', night ? .32 : dusk ? .12 : 0); $('lampGlow').setAttribute('opacity', night || dusk ? 1 : .35);
  const tk = $('tick'); for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180, c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', 30 + 20 * Math.sin(a)); c.setAttribute('cy', 30 - 20 * Math.cos(a)); c.setAttribute('r', i % 3 ? 1 : 1.7); tk.appendChild(c); }
  const tickClock = () => { const d = new Date(), m = d.getMinutes(), h = (d.getHours() % 12) + m / 60; $('hH').setAttribute('transform', `rotate(${h * 30} 30 30)`); $('hM').setAttribute('transform', `rotate(${m * 6} 30 30)`); };
  tickClock(); setInterval(tickClock, 20000);
  $('calD').textContent = S.num(new Date().getDate());

  const setBadge = (id, n) => { const g = $(id); if (!g) return; g.querySelector('text').textContent = n > 99 ? '99+' : S.num(n); g.classList.toggle('on', n > 0); };
  const D = {}, status = [];
  const chip = (txt, on, href) => `<${href ? 'a href="' + href + '"' : 'span'} class="chip${on ? ' on' : ''}"><i></i>${esc(txt)}</${href ? 'a' : 'span'}>`;

  // الاسم
  let first = '';
  try {
    const a = (await S.call(`/rest/v1/public_lawyers?select=id,display_name,verified&id=eq.${S.me()}`))[0];
    if (a) {
      D.me = a; const nm = (a.display_name || '').trim(), f = nm.replace(/^(أ\.?|د\.?|المستشار)\s*/, '').trim().split(/\s+/)[0] || '';
      first = f; $('certName').textContent = nm.length > 20 ? nm.slice(0, 19) + '…' : nm; $('certSub').textContent = a.verified ? 'محامي موثّق ✓' : 'Legano';
      $('plaque').textContent = 'أ. ' + (f || 'محامي'); $('hProfile').setAttribute('href', '/lawyer/' + a.id);
    }
  } catch {}
  $('doorName').textContent = first ? 'الأستاذ ' + first : 'الأستاذ';
  $('hello').textContent = `${hr < 12 ? 'صباح الخير' : hr < 18 ? 'نهارك سعيد' : 'مساء الخير'}${first ? ' يا أستاذ ' + first : ''}`;

  // دخول المكتب
  const enter = () => { door.classList.add('open'); setTimeout(() => door.classList.add('gone'), 1400); try { sessionStorage.setItem('lg_office', '1'); } catch {} };
  if (skipIntro) door.classList.add('gone');
  else { setTimeout(enter, 900); door.addEventListener('click', enter); }

  // البيانات الحية (كل واحدة لوحدها علشان لو فشلت ما توقفش الباقي)
  const todayISO = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();

  // ---------- الأدراج: كل حاجة بتتفتح هنا في المكتب من غير ما تسيبه ----------
  const sheet = $('sheet'), sBody = $('sBody'), when = d => d ? new Date(d + (d.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
  const rpcc = (fn, json) => S.call('/rest/v1/rpc/' + fn, { method: 'POST', json: json || {} });
  const empty = t => `<div class="sh-e">${t}</div>`;
  const netOf = r => { const p = Number(r.price) || 0; return p - Math.min(p, p * (Number(r.fee_pct) || 0) / 100 + (Number(r.fee_flat) || 0)); };
  const NT = (n, d) => { const a = d.authors[n.actor_id], who = a ? esc(a.display_name) : 'محامي', t = id => d.refs[id] ? ' «' + esc(d.refs[id]) + '»' : '', g = id => d.groups[id] ? ' «' + esc(d.groups[id]) + '»' : '';
    return ({ follow: `${who} بدأ يتابعك.`, like: `${who} تفاعل مع منشورك.`, reply: `${who} رد على تعليقك.`, comment: `${who} علّق على منشورك.`, ref_offer: `${who} قدّم عرض على إنابتك${t(n.referral_id)}.`, invite_verified: `${who} اللي دعيته اتوثّق حسابه.`, ref_accepted: `${who} اختارك تاخد إنابة${t(n.referral_id)}.`, ref_done: `${who} قفل الإنابة${t(n.referral_id)} كمكتملة.`, group_request: `${who} طلب الانضمام لجروب${g(n.group_id) || ' بتاعك'}.`, group_approved: `طلب انضمامك لجروب${g(n.group_id)} اتقبل.`, verified: 'تم توثيق حسابك.' })[n.type] || 'إشعار جديد.'; };
  const R = {
    profile: { t: 'شهادتي وبروفايلي', href: () => D.me ? '/lawyer/' + D.me.id : 'dashboard.html?panel=1', f: async () => D.me ? `<div class="sh-n"><div><small>الاسم</small><b style="font-size:1rem">${esc(D.me.display_name)}</b></div><div><small>الحالة</small><b style="font-size:1rem">${D.me.verified ? 'موثّق ✓' : 'لسه ما اتوثّقش'}</b></div></div><p class="sh-e" style="padding-top:4px">ده اللي الموكل بيشوفه لما يفتح بروفايلك. عدّل نبذتك وتخصصاتك من لوحتك علشان تاخد استشارات أكتر.</p>` : empty('مش لاقي بيانات بروفايلك.') },
    refs: { t: 'لوحة الإنابات', href: () => 'referrals.html', f: async () => { const rs = D.refs || await S.referralStats(); const rows = rs.tasks.map(t => `<div class="sh-r"><div><b>${esc(t.title)}</b><small>اتسندت ليك</small></div></div>`).join(''); return `<div class="sh-n"><div><small>عروض على إناباتك</small><b>${S.num(rs.offers)}</b></div><div><small>إنابات اتسندت ليك</small><b>${S.num(rs.tasks.length)}</b></div></div>${rows || empty('مفيش حاجة جديدة على اللوحة دلوقتي.')}`; } },
    cases: { t: 'دولاب القضايا', href: () => 'cases.html', f: async () => { const cs = D.cases || (await S.listCases()).filter(c => c.status === 'active'); return cs.length ? cs.slice(0, 10).map(c => { const h = S.nextHearing(c); return `<div class="sh-r"><div><b>${esc(c.title)}</b><small>${esc([c.case_type, c.court, c.client_label].filter(Boolean).join(' • '))}${h ? ' • جلسة ' + esc(when(h)) : ''}</small></div></div>`; }).join('') + (cs.length > 10 ? empty('وفي ' + S.num(cs.length - 10) + ' قضية تانية.') : '') : empty('مفيش قضايا شغّالة. ضيف أول قضية من صفحة القضايا.'); } },
    cal: { t: 'المفكرة', href: () => 'calendar.html', f: async () => { const cs = D.cases || (await S.listCases()).filter(c => c.status === 'active'), now = todayISO; const L = cs.map(c => ({ c, d: S.nextHearing(c) })).filter(x => x.d && x.d >= now).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8); return L.length ? L.map(x => `<div class="sh-r"><div><b>${esc(x.c.title)}</b><small>${x.d === now ? 'النهارده' : esc(when(x.d))}</small></div></div>`).join('') : empty('مفيش جلسات جاية متسجّلة.'); } },
    phone: { t: 'التليفون: الاستشارات', href: () => 'consultations.html', f: async () => {
      const [cfg, rows] = await Promise.all([C.mySettings().catch(() => D.cfg), C.mine().catch(() => D.rows || [])]); D.cfg = cfg; D.rows = rows;
      const pend = rows.filter(r => r.status === 'requested' && Date.now() - new Date(r.created_at).getTime() < 15 * 60000), rec = rows.filter(r => !pend.includes(r)).slice(0, 4);
      return `<label class="sh-sw"><span>${cfg && cfg.enabled ? 'أنت أونلاين وبتستقبل استشارات' : 'أنت أوفلاين'}</span><input type="checkbox" id="phOn" ${cfg && cfg.enabled ? 'checked' : ''} ${cfg ? '' : 'disabled'}></label>` +
        (pend.length ? pend.map(r => `<div class="sh-r"><div><b>🔔 ${esc(r.client_name)}</b><small>«${esc(r.client_topic)}» • ${S.num(r.minutes)} دقيقة</small><span class="am">صافيك ${S.num(Math.round(netOf(r)))} ج</span></div><div style="display:flex;gap:6px"><button class="sh-b ok" data-acc="${esc(r.id)}" type="button">اقبل</button><button class="sh-b g" data-rej="${esc(r.id)}" type="button">رفض</button></div></div>`).join('') : empty('مفيش موكل بيرنّ عليك دلوقتي.')) +
        (rec.length ? '<p style="margin:12px 0 2px;font-size:12px;color:#64748B;font-weight:800">آخر استشاراتك</p>' + rec.map(r => `<div class="sh-r"><div><b>${esc(r.client_name)}</b><small>${esc(C.ST[r.status] || r.status)}</small></div></div>`).join('') : ''); },
      b: () => { const on = $('phOn'); if (on) on.onchange = async () => { on.disabled = true; try { await C.saveSettings({ enabled: on.checked, price: D.cfg.price, minutes: D.cfg.minutes }); D.cfg.enabled = on.checked; $('phLed').setAttribute('fill', on.checked ? '#22c55e' : '#64748b'); S.toast(on.checked ? 'أنت دلوقتي أونلاين' : 'بقيت أوفلاين'); open('phone'); } catch (e) { on.checked = !on.checked; S.toast(S.friendly(e)); } on.disabled = false; };
        sBody.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => { b.disabled = true; try { await C.respond(b.dataset.acc, true); location.href = 'room.html?c=' + b.dataset.acc; } catch (e) { S.toast(S.friendly(e)); b.disabled = false; } });
        sBody.querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => { b.disabled = true; try { await C.respond(b.dataset.rej, false); S.toast('اترفض الطلب'); open('phone'); } catch (e) { S.toast(S.friendly(e)); b.disabled = false; } }); } },
    docs: { t: 'صينية طلبات المستندات', href: () => 'doc-orders.html', f: async () => { const d = await rpcc('doc_board'), o = d.orders || []; return `<p class="sh-e" style="padding:0 0 6px;text-align:start">شغّال عليك ${S.num(d.active)} من ${S.num(d.max_active)}.</p>` + (o.length ? o.map(x => `<div class="sh-r"><div><b>${esc(x.title)}</b><small>تسليم خلال ${S.num(x.due_hours)} ساعة</small><span class="am">صافيك ${S.num(x.net)} ج</span></div><button class="sh-b ok" data-doc="${esc(x.id)}" type="button">اقبل</button></div>`).join('') : empty('مفيش طلبات متاحة دلوقتي.')); },
      b: () => sBody.querySelectorAll('[data-doc]').forEach(b => b.onclick = async () => { b.disabled = true; try { await rpcc('doc_accept', { p_id: b.dataset.doc }); S.toast('اتقبل الطلب. كمّله من صفحة الطلبات'); open('docs'); } catch (e) { S.toast(/doc_taken/.test(e.message) ? 'حد تاني سبقك' : /doc_limit/.test(e.message) ? 'عندك طلبات شغّالة كتير' : S.friendly(e)); b.disabled = false; } }) },
    feed: { t: 'اللابتوب: المنشورات', href: () => 'feed.html', f: async () => { const d = await S.listPosts({ mode: 'all', limit: 4 }); return d.posts.length ? d.posts.map(p => { const a = d.authors[p.author_id]; return `<div class="sh-r"><div><b>${esc(a ? a.display_name : 'محامي')}</b><small>${esc(String(p.body || '').slice(0, 110))}</small></div></div>`; }).join('') : empty('مفيش منشورات جديدة.'); } },
    bell: { t: 'الجرس: الإشعارات', href: () => 'notifications.html', f: async () => { const d = await S.listNotifications(), r = d.rows.slice(0, 8); return r.length ? r.map(n => `<div class="sh-r"><div><b style="${n.read ? 'font-weight:600' : ''}">${NT(n, d)}</b><small>${esc(S.ago(n.created_at))}</small></div></div>`).join('') + (r.some(n => !n.read) ? '<div style="padding-top:8px"><button class="sh-b g" id="allRd" type="button">علّم الكل مقروء</button></div>' : '') : empty('مفيش إشعارات لسه.'); },
      b: () => { const b = $('allRd'); if (b) b.onclick = async () => { try { await S.markAllRead(); setBadge('bBell', 0); S.toast('تم'); open('bell'); } catch (e) { S.toast(S.friendly(e)); } }; } },
    wallet: { t: 'الخزنة: محفظتك', href: () => 'consultations.html#wallet', f: async () => { const w = await C.wallet(), n = x => S.num(Number(x) || 0); return `<div class="sh-n"><div><small>المتاح للسحب</small><b>${n(w.available)} ج</b></div><div><small>إجمالي أرباحك</small><b>${n(w.total_earned)} ج</b></div></div>${w.on_hold != null ? `<div class="sh-n" style="grid-template-columns:1fr"><div><small>معلّق لحد تأكيد الموكل</small><b>${n(w.on_hold)} ج</b></div></div>` : ''}<p class="sh-e" style="padding-top:4px;text-align:start">طلب السحب من صفحة المحفظة.</p>`; } }
  };
  let curK = null;
  function open(k) { const r = R[k]; if (!r) return; curK = k; $('sTitle').textContent = r.t; $('sLink').href = r.href(); sBody.innerHTML = empty('بحمّل…'); sheet.classList.add('on'); document.body.style.overflow = 'hidden'; const kk = k;
    Promise.resolve(r.f()).then(h => { if (curK !== kk) return; sBody.innerHTML = h; if (r.b) r.b(); }).catch(e => { if (curK === kk) sBody.innerHTML = empty(esc(S.friendly(e))); }); }
  const close = () => { sheet.classList.remove('on'); document.body.style.overflow = ''; curK = null; };
  $('sX').onclick = close; $('sOv').onclick = close; document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  const MAP = { hProfile: 'profile', hRef: 'refs', hCases: 'cases', hDocs: 'docs', hFeed: 'feed', hCal: 'cal', hPhone: 'phone', hBell: 'bell', hWallet: 'wallet' };
  Object.keys(MAP).forEach(id => { const a = $(id); a.addEventListener('click', e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); open(MAP[id]); }); });
  // لوحات الأسماء (pills) خلف كل عنوان
  const pills = () => document.querySelectorAll('#sv .lbl').forEach(t => { if (t.previousSibling && t.previousSibling.classList && t.previousSibling.classList.contains('pill')) t.previousSibling.remove(); if (!t.textContent.trim()) return; const b = t.getBBox(), r = document.createElementNS(NS, 'rect'); r.setAttribute('class', 'pill'); r.setAttribute('x', b.x - 6); r.setAttribute('y', b.y - 1); r.setAttribute('width', b.width + 12); r.setAttribute('height', b.height + 2); r.setAttribute('rx', (b.height + 2) / 2); t.parentNode.insertBefore(r, t); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { pills(); setTimeout(pills, 1500); });

  const jobs = [
    async () => { const n = await S.unreadCount(); D.unread = n; setBadge('bBell', n); },
    async () => { const cs = await S.listCases(), act = cs.filter(c => c.status === 'active'); D.cases = act; setBadge('bCases', act.length); const td = act.filter(c => S.nextHearing(c) === todayISO).length; setBadge('bCal', td); if (td) status.push(chip(`${S.num(td)} جلسة النهارده`, true, 'calendar.html')); },
    async () => { const rs = await S.referralStats(), n = rs.offers + rs.tasks.length; D.refs = rs; setBadge('bRef', n); if (n) status.push(chip(`${S.num(n)} جديد في الإنابات`, true, 'referrals.html')); },
    async () => { const d = await S.call('/rest/v1/rpc/doc_board', { method: 'POST', json: {} }); const n = (d.orders || []).length; setBadge('bDocs', n); if (n) status.push(chip(`${S.num(n)} طلب مستند متاح`, true, 'doc-orders.html')); },
    async () => {
      const [cfg, rows] = await Promise.all([C.mySettings().catch(() => null), C.mine().catch(() => [])]); D.cfg = cfg; D.rows = rows;
      const pend = rows.filter(r => r.status === 'requested' && Date.now() - new Date(r.created_at).getTime() < 15 * 60000).length;
      setBadge('bPhone', pend); $('phone').classList.toggle('on', pend > 0);
      $('phLed').setAttribute('fill', cfg && cfg.enabled ? '#22c55e' : '#64748b');
      status.unshift(chip(cfg && cfg.enabled ? 'أونلاين للاستشارات' : 'أوفلاين: فعّل الاستشارات', !!(cfg && cfg.enabled), 'consultations.html'));
      if (pend) status.unshift(chip(`${S.num(pend)} موكل بيرنّ عليك`, true, 'consultations.html'));
    },
    async () => { const w = await C.wallet(), av = Number(w.available) || 0; $('walletAmt').textContent = S.num(av) + ' ج'; D.wallet = w; setTimeout(pills, 50); }
  ];
  await Promise.allSettled(jobs.map(j => j()));
  $('status').innerHTML = status.join('');
  if (!status.length) $('status').innerHTML = chip('مفيش حاجة مستعجلة. اشرب قهوتك ☕', false);
})();
</script>
