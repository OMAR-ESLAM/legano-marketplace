<style>
  :root { color-scheme: light; --background:#F8FAFB; --foreground:#1E293B; --card:#FFFFFF; --border:#E2E8F0; --muted-foreground:#64748B; --secondary:#EEF2F7; --gold:#0F172A; --gold-soft:#92620C; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--background); color: var(--foreground); line-height: 1.7; }
  .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 18px; text-decoration: none; background: linear-gradient(90deg, #0F172A, #92620C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .top { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 20px; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  #navSlot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .back { display: inline-block; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--gold-soft); text-decoration: none; }
  .warn { padding: 12px 14px; margin-bottom: 14px; background: #FFF8E6; border: 1px solid #F1D48A; color: #7A5200; border-radius: 12px; font-size: 13px; line-height: 1.9; }
  .warn a { color: inherit; font-weight: 800; }
  .cs-wrap { max-width: 1240px; }
  .cs-consent { white-space: pre-line; }
  .cs-fa { display: flex; gap: 10px; flex-shrink: 0; }
  .cs-docbody { position: relative; }
  .cs-ptr { position: absolute; z-index: 5; width: 0; height: 0; pointer-events: none; display: none; }
  .cs-ptr i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: rgba(220,38,38,.85); box-shadow: 0 0 0 4px rgba(220,38,38,.25); }
  .cs-ptr span { position: absolute; left: 12px; top: 8px; background: #DC2626; color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
  .cs-docx { background: #fff; text-align: start; padding: 18px; border-radius: 10px; line-height: 1.9; font-size: 15px; color: #1E293B; }
  .cs-docx img { max-width: 100%; height: auto; } .cs-docx table { border-collapse: collapse; max-width: 100%; } .cs-docx td, .cs-docx th { border: 1px solid #cbd5e1; padding: 4px 8px; }
  .cs-follow[hidden] { display: none; }
  .cs-follow { font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .cs-tabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .cs-tabs button { flex: 1; font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 4px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted-foreground); cursor: pointer; position: relative; }
  .cs-tabs button.on { color: var(--foreground, #0F172A); border-bottom-color: var(--gold-soft, #92620C); }
  .cs-tabs i { display: inline-block; min-width: 18px; padding: 0 5px; margin-inline-start: 4px; border-radius: 9px; background: #DC2626; color: #fff; font-size: 11px; font-style: normal; line-height: 18px; }
  .cs-pane[hidden] { display: none; }
  .cs-chat { height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--secondary); border-radius: 12px; margin-bottom: 8px; }
  .cs-msg { max-width: 85%; padding: 6px 10px; border-radius: 12px; font-size: 13.5px; line-height: 1.7; word-break: break-word; }
  .cs-msg.me { align-self: flex-start; background: var(--primary, #0F172A); color: #fff; }
  .cs-msg.them { align-self: flex-end; background: #fff; border: 1px solid var(--border); }
  .cs-msg a { color: inherit; text-decoration: underline; }
  .cs-chatform { display: flex; gap: 6px; } .cs-chatform input { flex: 1; min-width: 0; font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; }
  .cs-chatform button, .cs-notes button { font-family: inherit; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 10px; border: 0; background: var(--primary, #0F172A); color: #fff; cursor: pointer; }
  .cs-notes label { display: block; font-size: 12.5px; font-weight: 700; margin: 6px 0 4px; } .cs-notes textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; resize: vertical; line-height: 1.8; }
  .cs-notes small { color: var(--muted-foreground); display: block; margin-bottom: 4px; line-height: 1.7; }
  .cs-sum { margin-top: 10px; padding: 12px 14px; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 12px; font-size: 14px; line-height: 1.9; }
  .cs-sum pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; margin: 6px 0 8px; }
  .cs-sum button { font-family: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 9px; border: 1px solid var(--border); background: #fff; cursor: pointer; margin-inline-end: 6px; }
  .cs-room { grid-template-columns: 1fr 320px; grid-template-areas: "v a"; }
  .cs-vbox { grid-area: v; } .cs-doc { grid-area: d; } .cs-room > aside { grid-area: a; }
  .cs-room.withdoc { grid-template-columns: 1fr clamp(360px, 38%, 560px); grid-template-areas: "d v" "d a"; }
  .cs-doc { display: flex; flex-direction: column; height: min(82vh, 860px); background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .cs-doc[hidden] { display: none; }
  .cs-dochd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .cs-dochd b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cs-dochd select, .cs-dochd button { font-family: inherit; font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 9px; background: #fff; cursor: pointer; max-width: 180px; }
  .cs-docbody { flex: 1; min-height: 0; overflow: auto; background: var(--secondary); padding: 12px; text-align: center; }
  .cs-docbody.flush { padding: 0; }
  .cs-docbody canvas { display: block; max-width: 100%; height: auto; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  .cs-docbody img { max-width: 100%; height: auto; border-radius: 6px; background: #fff; }
  .cs-docbody iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .cs-docbody pre { text-align: start; white-space: pre-wrap; word-break: break-word; background: #fff; padding: 14px; border-radius: 10px; font-family: inherit; font-size: 14px; line-height: 1.9; margin: 0; }
  .cs-dmsg { padding: 40px 16px; color: var(--muted-foreground); font-size: 14px; line-height: 2; }
  .cs-dmsg button { font-family: inherit; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; }
  @media (max-width: 820px) { .cs-room, .cs-room.withdoc { grid-template-columns: 1fr; grid-template-areas: "v" "d" "a"; } .cs-doc { height: 70vh; } }

<body>
<header class="top"><a class="logo-text" href="index.html?browse=1">LEGANO</a><div id="navSlot"></div></header>
<main class="cs-wrap">
  <div class="cs-test">⚠️ وضع تجريبي: الدفع لسه مش مفعّل، والأرقام للتجربة بس.</div>
  <div id="gate" class="soc-card gate" hidden><h1>سجّل دخول</h1><p>الغرفة دي للمحامي صاحب الاستشارة. سجّل دخول بحسابك.</p><a class="soc-btn primary" href="dashboard.html">دخول المحامين</a></div>
  <div id="stage" aria-live="polite"><div class="empty" style="border:0">جاري التحميل...</div></div>
</main>
<script src="js/social.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id), S = window.Social, C = S.Consult, esc = S.esc;
  S.mountNav($('navSlot'));
  const q = new URLSearchParams(location.search), TOKEN = q.get('t'), CID = q.get('c');
  const ROLE = TOKEN ? 'client' : 'lawyer';
  if (ROLE === 'lawyer' && (!S.me() || !CID)) { $('gate').hidden = false; $('stage').hidden = true; return; }
  if (ROLE === 'client' && !TOKEN) { $('stage').innerHTML = '<div class="empty">الرابط ناقص.</div>'; return; }

  // نص الموافقة مبدئي، ولازم يتراجع مع المستشار القانوني قبل الإطلاق الفعلي
  const CONSENT = 'تتم هذه الاستشارة عبر اتصال مباشر بين الطرفين داخل منصة ليجانو، ولا يتم تسجيل الصوت ولا الفيديو. الاتصال المباشر يعني أن عنوان الاتصال (IP) لكل طرف قد يظهر للطرف الآخر تقنياً.\n\nيتم تحويل الكلام إلى نص مكتوب أثناء الاستشارة: يحوّل متصفح كل طرف كلامه هو فقط إلى نص، وقد يُرسَل الصوت لهذا الغرض إلى خدمة التعرف على الكلام التابعة لمتصفحك (مثل Google في Chrome). يُحفظ النص دون الصوت، ويراجعه فريق المنصة فقط عند وجود اعتراض. قد لا يكون النص دقيقاً.\n\nتُحذف الملفات والرسائل والملخص والنص تلقائياً بعد انتهاء مهلة الاعتراض. المنصة ليست طرفاً في العلاقة بين المحامي والموكل، والاستشارة لا تُنشئ توكيلاً بأي دعوى.';
  const FINAL = ['released', 'refunded', 'cancelled', 'expired'];
  let st = null, offset = 0, joining = false, pingTimer = null, filesSig = '', fileList = [], lastStatus = null;
  const my = k => ROLE === 'client' ? st['client_' + k] : st['lawyer_' + k];
  const other = k => ROLE === 'client' ? st['lawyer_' + k] : st['client_' + k];
  const cid = () => ROLE === 'client' ? st.id : CID;
  const tk = () => ROLE === 'client' ? TOKEN : null;
  const nowMs = () => Date.now() + offset;
  const mm = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const fmt = d => d ? new Date(d).toLocaleString('ar-EG', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }) : '';
  // ما نعيدش الرسم لو الشكل ما اتغيّرش، علشان علامة الموافقة وكلام الموكل في خانة الاعتراض ما يتمسحوش كل 3 ثواني
  let lastHtml = '';
  const set = h => { if (h === lastHtml) return; lastHtml = h; $('stage').innerHTML = h; };
  const who = () => ROLE === 'client' ? `الأستاذ/ة <b>${esc(st.lawyer.name)}</b>` : `الموكل <b>${esc(st.client_name)}</b>`;
  const earn = () => (st.price - Math.min(st.price, Math.round(st.price * (st.fee_pct || 0)) / 100 + Number(st.fee_flat || 0))).toFixed(2);

  async function tick() {
    try { st = await (ROLE === 'client' ? C.clientGet(TOKEN) : C.lawyerGet(CID)); } catch (e) { return; }
    if (!st) { set('<div class="empty">الاستشارة دي مش موجودة أو الرابط غلط.</div>'); return; }
    offset = Date.parse(st.now) - Date.now();
    if (st.status !== lastStatus) { lastStatus = st.status; if (st.status !== 'live') { stopPing(); } if (!['accepted', 'live'].includes(st.status)) stopP2P(); filesSig = ''; }
    view();
    if (['accepted', 'live', 'awaiting_confirm'].includes(st.status)) refreshFiles();
    refreshExtras(); txSync();
  }

  function stopPing() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }
  function startPing() { if (pingTimer) return; pingTimer = setInterval(() => { C.ping(cid(), tk()).catch(() => {}); }, 10000); C.ping(cid(), tk()).catch(() => {}); }

  async function autoJoin() {
    if (joining) return; joining = true;
    try { await C.join(cid(), tk()); } catch (e) { S.toast(S.friendly(e)); }
    joining = false; tick();
  }
  // ---- الغرفة: اتصال مباشر (WebRTC) بين الطرفين. الإشارات بتعدّي عن طريق قاعدة البيانات، والفيديو نفسه ما بيعدّيش على أي سيرفر ----
  const mySid = Math.random().toString(36).slice(2, 10);
  let dc = null, remoteStream = null, camNote = '', pc = null, localStream = null, peerSid = null, sigAfter = 0, sigTimer = null, helloTimer = null, p2pOn = false, polling = false, pendingIce = [], iceCfg = null, connState = '', mediaErr = '', camOn = true, micOn = true;
  const sig = p => C.signalSend(cid(), tk(), p).catch(() => {});
  const vmsg = t => { const m = $('vmsg'); if (m) { m.textContent = t || ''; m.style.display = t ? 'flex' : 'none'; } };
  async function getIce() {
    if (iceCfg) return iceCfg;
    try { const j = await (await fetch('/api/ice')).json(); if (Array.isArray(j.iceServers) && j.iceServers.length) iceCfg = j.iceServers; } catch {}
    return iceCfg || (iceCfg = [{ urls: 'stun:stun.l.google.com:19302' }]);
  }
  async function startMedia() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mediaErr = 'المتصفح ده مش بيدعم الفيديو. استخدم Chrome أو Safari حديث.'; return; }
    try { localStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) {
      try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); camOn = false; camNote = e && e.name === 'NotReadableError' ? 'الكاميرا مستخدمة في برنامج أو متصفح تاني، فالاستشارة عندك صوت بس.' : 'الكاميرا مش متاحة (اتأكد من السماح للمتصفح)، فالاستشارة عندك صوت بس.'; }
      catch (e2) { mediaErr = 'لازم تسمح للمتصفح باستخدام الميكروفون (والكاميرا) علشان تدخل الغرفة. اسمح من شريط العنوان وحدّث الصفحة.'; }
    }
  }
  function showNotes() {
    const n = $('cnote'); if (!n) return; const rv = $('rv'), src = rv && rv.srcObject;
    const noRemoteCam = connState === 'connected' && (!src || !src.getVideoTracks().length || !rv.videoWidth);
    n.textContent = [camNote, noRemoteCam ? 'كاميرا الطرف التاني مش ظاهرة (قافلها أو مش شغالة عنده).' : '', txNote].filter(Boolean).join(' • '); n.style.display = n.textContent ? 'block' : 'none';
  }
  setInterval(showNotes, 1500);
  const DEBUG = q.get('debug') === '1';
  setInterval(async () => {
    const d = $('dbg'); if (!DEBUG || !d) return; const t = [];
    t.push(pc ? 'pc:' + pc.connectionState + ' ice:' + pc.iceConnectionState : 'pc:none');
    t.push('local:' + (localStream ? localStream.getTracks().map(x => x.kind + ':' + x.readyState + (x.enabled ? '' : ':off')).join(',') : 'none'));
    const rv = $('rv'), rs = rv && rv.srcObject; t.push('remote:' + (rs ? rs.getTracks().map(x => x.kind + ':' + x.readyState + (x.muted ? ':muted' : '')).join(',') : 'none') + ' videoWidth:' + (rv ? rv.videoWidth : 0));
    try { (await pc.getStats()).forEach(r => { if (r.type === 'inbound-rtp') t.push('in-' + r.kind + ' bytes:' + r.bytesReceived + (r.framesDecoded != null ? ' frames:' + r.framesDecoded : '')); if (r.type === 'outbound-rtp') t.push('out-' + r.kind + ' bytes:' + r.bytesSent); }); } catch {}
    d.textContent = t.join('\n');
  }, 2000);
  function attachLocal() { const lv = $('lv'); if (lv && localStream) { lv.srcObject = localStream; lv.play().catch(() => {}); } }
  async function newPc() {
    closePc();
    pc = new RTCPeerConnection({ iceServers: await getIce() });
    const me = pc;
    // لازم الاتنين يكون عندهم خط صوت وخط فيديو في العرض حتى لو كاميرا اللي بيعرض مش شغالة، وإلا كاميرا الطرف التاني ما تقدرش توصل
    const at = localStream && localStream.getAudioTracks()[0], vt = localStream && localStream.getVideoTracks()[0];
    if (ROLE === 'lawyer') {
      if (at) me.addTrack(at, localStream); else me.addTransceiver('audio', { direction: 'recvonly' });
      if (vt) me.addTrack(vt, localStream); else me.addTransceiver('video', { direction: 'recvonly' });
    }
    me.onicecandidate = e => { if (e.candidate && pc === me) sig({ t: 'ice', from: mySid, to: peerSid, c: e.candidate.toJSON() }); };
    if (ROLE === 'lawyer') setupDc(me.createDataChannel('app')); else me.ondatachannel = e => setupDc(e.channel);
    me.ontrack = e => { const rv = $('rv'); if (!rv) return; if (!remoteStream) remoteStream = new MediaStream(); remoteStream.addTrack(e.track); rv.srcObject = remoteStream; e.track.onunmute = () => { rv.play().catch(() => {}); }; rv.play().catch(() => vmsg('اضغط هنا لتشغيل الصوت والفيديو')); };
    me.onconnectionstatechange = () => {
      if (pc !== me) return; connState = me.connectionState;
      if (connState === 'connected') vmsg('');
      else if (connState === 'connecting') vmsg('جاري الاتصال...');
      else if (connState === 'disconnected') vmsg('الاتصال ضعيف... بيحاول يرجع');
      else if (connState === 'failed') { vmsg('انقطع الاتصال، بنعيد المحاولة...'); if (ROLE === 'lawyer') renegotiate(true); }
      const rs = $('room-status'); if (rs) rs.innerHTML = statusLine();
    };
    return me;
  }
  function closePc() { remoteStream = null; dc = null; if (pc) { const o = pc; pc = null; o.onicecandidate = o.ontrack = o.onconnectionstatechange = null; try { o.close(); } catch {} } pendingIce = []; connState = ''; }
  async function renegotiate(restart) {
    if (ROLE !== 'lawyer' || !pc) return;
    try { const o = await pc.createOffer(restart ? { iceRestart: true } : undefined); await pc.setLocalDescription(o); sig({ t: 'offer', from: mySid, to: peerSid, sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } }); } catch {}
  }
  async function makeOffer(sid) { peerSid = sid; vmsg('جاري الاتصال...'); await newPc(); await renegotiate(false); }
  async function attachMine() {
    for (const tr of pc.getTransceivers()) {
      const k = tr.receiver && tr.receiver.track && tr.receiver.track.kind, t = localStream && localStream.getTracks().find(x => x.kind === k);
      if (!t) continue;
      try { tr.direction = 'sendrecv'; await tr.sender.replaceTrack(t); if (tr.sender.setStreams) tr.sender.setStreams(localStream); } catch {}
    }
  }
  async function flushIce() { const q = pendingIce; pendingIce = []; for (const c of q) { try { await pc.addIceCandidate(c); } catch {} } }
  async function onSignal(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'hello') {
      if (m.sid === peerSid) return;
      if (ROLE === 'lawyer') await makeOffer(m.sid); else sig({ t: 'hello', sid: mySid });
    } else if (m.t === 'offer' && ROLE === 'client' && m.to === mySid && m.sdp) {
      const fresh = !pc || peerSid !== m.from;
      if (fresh) { peerSid = m.from; await newPc(); }
      try { await pc.setRemoteDescription(m.sdp); if (fresh) await attachMine(); await flushIce(); const a = await pc.createAnswer(); await pc.setLocalDescription(a); sig({ t: 'answer', from: mySid, to: m.from, sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } }); } catch {}
    } else if (m.t === 'answer' && ROLE === 'lawyer' && m.to === mySid && m.from === peerSid && pc && m.sdp) {
      try { await pc.setRemoteDescription(m.sdp); await flushIce(); } catch {}
    } else if (m.t === 'app' && m.to === mySid && m.from === peerSid) { onApp(m.d);
    } else if (m.t === 'ice' && m.to === mySid && m.from === peerSid && pc && m.c) {
      if (pc.remoteDescription) { try { await pc.addIceCandidate(m.c); } catch {} } else pendingIce.push(m.c);
    }
  }
  async function pollSig() {
    if (polling || !p2pOn) return; polling = true;
    try { const l = await C.signalPoll(cid(), tk(), sigAfter); for (const x of l) { sigAfter = Math.max(sigAfter, x.id); await onSignal(x.p); } } catch {}
    polling = false;
  }
  async function startP2P() {
    if (p2pOn) return; p2pOn = true;
    await startMedia(); attachLocal();
    if (mediaErr) { vmsg(mediaErr); p2pOn = false; return; }
    if (!camOn) { const b = $('bCam'); if (b) b.disabled = true; }
    vmsg('في انتظار الطرف التاني...');
    sig({ t: 'hello', sid: mySid });
    sigTimer = setInterval(pollSig, 1200); pollSig();
    helloTimer = setInterval(() => { if (connState !== 'connected') sig({ t: 'hello', sid: mySid }); }, 6000);
    txSync();
  }
  function stopP2P() {
    txStop(); p2pOn = false; clearInterval(sigTimer); clearInterval(helloTimer); sigTimer = helloTimer = null; closePc(); peerSid = null; sigAfter = 0;
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  }
  window.addEventListener('beforeunload', stopP2P);
  document.addEventListener('click', e => {
    if (e.target.id === 'vmsg') { const rv = $('rv'); if (rv && rv.srcObject) { rv.play().then(() => vmsg('')).catch(() => {}); } }
    if (e.target.closest('#bFs')) { const v = $('vid'); if (document.fullscreenElement) document.exitFullscreen(); else if (v && v.requestFullscreen) v.requestFullscreen().catch(() => {}); return; }
    const b = e.target.closest('#bMic, #bCam'); if (!b || !localStream) return;
    if (b.id === 'bMic') { micOn = !micOn; localStream.getAudioTracks().forEach(t => t.enabled = micOn); b.classList.toggle('off', !micOn); b.textContent = micOn ? '🎤' : '🔇'; txSync(); }
    else { camOn = !camOn; localStream.getVideoTracks().forEach(t => t.enabled = camOn); b.classList.toggle('off', !camOn); b.textContent = camOn ? '📷' : '🚫'; }
  });

  function view() {
    const s = st.status;
    if (s === 'requested') return viewRequested();

    if (s === 'accepted' || s === 'live') {
      if (!my('joined')) { autoJoin(); return set('<div class="empty" style="border:0">جاري تجهيز الغرفة...</div>'); }
      return viewRoom();
    }

    return viewFinal();
  }

  function viewRequested() {
    if (ROLE === 'lawyer') {

        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="soc-btn primary" data-a="accept" type="button">قبول</button><button class="soc-btn" data-a="reject" type="button">رفض</button></div></div>`);
    }

    set(`<div class="cs-box"><h2>بعتنا طلبك لـ ${esc(st.lawyer.name)}</h2><p>في انتظار رد المحامي. لو ما ردّش خلال دقيقتين الطلب بيتلغي وما بيتسحبش منك حاجة.</p><p><b dir="ltr">${mm(left)}</b></p><button class="soc-btn" data-a="cancel" type="button">إلغاء الطلب</button></div>`);
  }
  function viewConsent() {
    set(`<div class="cs-box"><h2>${ROLE === 'client' ? 'المحامي قبل طلبك' : 'تجهيز الاستشارة'}</h2><p>قبل ما تدخلوا الغرفة، لازم الطرفين يوافقوا على الشروط دي.</p>
      <div class="cs-consent">${esc(CONSENT)}</div>
      <label class="cs-chk"><input type="checkbox" id="agree"><span>قرأت وأوافق على كل الشروط دي.</span></label>

  function viewWaitConsent() { set(`<div class="cs-box"><h2>وافقت على الشروط</h2><p>في انتظار موافقة ${who()}...</p><button class="soc-btn" data-a="cancel" type="button">إلغاء</button></div>`); }

  function viewRoom() {
    if (st.status === 'live') startPing();
    if ($('room-wrap')) { $('room-status').innerHTML = statusLine(); return; }
    set(`<div class="cs-room" id="roomgrid"><div class="cs-vbox"><div class="cs-video" id="vid">
        <video id="rv" autoplay playsinline></video>
        <video id="lv" autoplay playsinline muted></video>
        <div class="cs-note" id="cnote" style="display:none"></div>
        <div class="cs-brand">LEGANO<small>غرفة استشارة</small></div>
        <div class="cs-ov" id="vmsg">جاري تجهيز الكاميرا...</div>
        <div class="cs-ctl"><button type="button" id="bMic" title="الميكروفون">🎤</button><button type="button" id="bCam" title="الكاميرا">📷</button><button type="button" id="bFs" title="ملء الشاشة">⛶</button></div></div>
      <div class="cs-bar"><span id="room-status">${statusLine()}</span><button class="soc-btn" data-a="end" type="button">إنهاء الاستشارة</button></div><div id="sumBox"></div>${DEBUG ? '<pre id="dbg" dir="ltr" style="font-size:11px;white-space:pre-wrap;background:#0F172A;color:#A7F3D0;padding:8px;border-radius:10px;margin:0"></pre>' : ''}</div>
      <section class="cs-doc" id="docv" hidden><div class="cs-dochd"><b id="docname"></b><select id="docsel" aria-label="اختار المستند"></select><label class="cs-follow" id="followLbl"><input type="checkbox" id="follow" checked> اتبع المحامي</label><button type="button" data-a="dldoc">تحميل</button><button type="button" data-a="closedoc" aria-label="إغلاق">✕</button></div><div class="cs-docbody" id="docbody"></div></section>
      <aside class="cs-box" id="room-wrap">
        <div class="cs-tabs"><button type="button" data-tab="files" class="on">الملفات</button><button type="button" data-tab="chat">المحادثة<i id="chatBadge" hidden></i></button>${ROLE === 'lawyer' ? '<button type="button" data-tab="notes">ملاحظاتي</button>' : ''}</div>
        <div class="cs-pane" id="pane-files"><div class="cs-drop" id="drop">اسحب الملفات هنا أو اضغط للاختيار<br><small>PDF أو صور أو Word، حتى 4 ميجا</small></div><input type="file" id="pick" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx"><div id="files"></div></div>
        <div class="cs-pane" id="pane-chat" hidden><div class="cs-chat" id="chatlog"></div><form class="cs-chatform" id="chatform" autocomplete="off"><input id="chatin" maxlength="1000" placeholder="اكتب رسالة..." aria-label="رسالة"><button type="submit">إرسال</button></form></div>
        ${ROLE === 'lawyer' ? `<div class="cs-pane cs-notes" id="pane-notes" hidden>${notesHtml()}</div>` : ''}
      </aside></div>`);
    wireDrop(); renderFiles(); renderChat(); wireDoc(); if (ROLE === 'lawyer') wireNotes(); updateSum(); startP2P();
  }
  function statusLine() {
    if (st.status === 'accepted') return `<span style="color:#7A5200;font-weight:800">في انتظار ${who()} يدخل الغرفة...</span>`;
    const el = Math.max(0, (nowMs() - Date.parse(st.started_at)) / 1000), tot = st.minutes * 60;
    const c = connState === 'connected' ? '<span style="color:#15803D;font-weight:800">● متصل</span>' : '<span style="color:#7A5200;font-weight:800">● بيتوصّل</span>';
    return `<b>${who()}</b> • <span dir="ltr">${mm(el)} / ${mm(tot)}</span> • ${c}${st.tx_on ? ' • <span title="كلامكم بيتحوّل لنص مكتوب بموافقة الطرفين">📝 نص مكتوب</span>' : ''}`;
  }
  setInterval(() => { if (st && st.status === 'live' && $('room-status')) $('room-status').innerHTML = statusLine(); }, 1000);

  function viewConfirm() {
    const dl = fmt(st.confirm_deadline);
    if (ROLE === 'lawyer') return set(`<div class="cs-box"><h2>الاستشارة خلصت</h2><p>في انتظار تأكيد الموكل. لو ما اعترضش قبل <b>${dl}</b>، هتتحوّل ${earn()} ج لمحفظتك تلقائياً.</p></div><aside class="cs-box cs-notes"><h2>ملخص للموكل</h2>${notesHtml()}</aside>${sumHtml()}${filesBox()}`), renderFiles(), wireDrop(), wireNotes();
    set(`<div class="cs-box"><h2>خدت استشارتك؟</h2><p>أكّد علشان الفلوس تروح للمحامي. لو ما ردّيتش قبل <b>${dl}</b> هتتأكد تلقائياً.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="soc-btn primary" data-a="confirm" type="button">أيوه، الاستشارة تمت</button><button class="soc-btn" data-a="problem" type="button">عندي مشكلة</button></div>
      <div id="prob" hidden style="margin-top:12px"><label class="f-l" for="reason">إيه المشكلة؟</label><textarea id="reason" class="f-i" rows="3" maxlength="500" placeholder="مثال: المحامي ما ردّش على أسئلتي"></textarea><button class="soc-btn primary" data-a="dispute" type="button" style="margin-top:8px">ابعت الاعتراض</button><p style="margin-top:8px">الفلوس هتتجمّد ولحد ما فريق المنصة يراجع الموضوع.</p></div></div>${sumHtml()}${filesBox()}`);
    renderFiles(); wireDrop();
  }
  const filesBox = () => `<aside class="cs-box"><h2>الملفات</h2><div id="files"></div></aside>`;

  function viewFinal() {
    const s = st.status;
    const M = {
      released: ROLE === 'lawyer' ? `<h2>✅ تمّت الاستشارة</h2><p>اتضاف <b>${earn()} ج</b> لمحفظتك (بعد خصم عمولة المنصة).</p><a class="soc-btn primary" href="consultations.html">رجوع للاستشارات</a>` : `<h2>✅ شكراً ليك</h2><p>اتأكدت الاستشارة وراحت الفلوس للمحامي. ممكن تقيّم المحامي من صفحته.</p><a class="soc-btn primary" href="/lawyer/${esc(st.lawyer.id)}">صفحة المحامي</a>`,
      disputed: `<h2>قيد المراجعة</h2><p>${st.short_session ? 'الجلسة كانت أقصر من الحد الأدنى، ' : ''}الفلوس متجمّدة لحد ما فريق المنصة يراجع الاستشارة ويبلّغ الطرفين.</p>`,
      refunded: `<h2>اتردّت</h2><p>الاستشارة اتردّت بالكامل للموكل.</p>`,
      cancelled: `<h2>الاستشارة اتلغت</h2><p>مفيش أي مبلغ اتسحب.</p>`,
      expired: `<h2>انتهى الوقت</h2><p>الطلب انتهى من غير ما تتم الاستشارة. مفيش أي مبلغ اتسحب.</p>`,
    };
    set(`<div class="cs-box">${M[s] || ''}</div>${sumHtml()}`);
    if (FINAL.includes(s)) { stopPing(); try { if (ROLE === 'client') localStorage.removeItem('lg_ct'); } catch {} }
  }

  // ---- الملفات ----
  async function refreshFiles() {
    try { const l = await C.files(cid(), tk()); const sig = JSON.stringify(l.map(f => f.id)); if (sig !== filesSig) { filesSig = sig; fileList = l; renderFiles(); onFilesChanged(l); } } catch {}
  }
  function renderFiles() {
    const box = $('files'); if (!box) return;
    box.innerHTML = fileList.length ? fileList.map(f => `<div class="cs-file"><span title="${esc(f.name)}">${esc(f.name)} <small>(${f.uploader === ROLE ? 'أنت' : 'الطرف التاني'})</small></span><span class="cs-fa">${$('docv') ? `<button type="button" data-a="view" data-f="${esc(f.id)}">عرض</button>` : ''}<button type="button" data-a="dl" data-f="${esc(f.id)}">تحميل</button></span></div>`).join('') : '<small style="color:var(--muted-foreground)">مفيش ملفات لسه.</small>';
  }
  const OK = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'text/plain', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
  async function upload(files) {
    for (const f of files) {
      if (!OK.includes(f.type)) { S.toast('نوع الملف مش مسموح: ' + f.name); continue; }
      if (f.size > 4000000) { S.toast('الملف أكبر من 4 ميجا: ' + f.name); continue; }
      try {
        const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
        await C.filePut(cid(), tk(), f.name, f.type, b64); S.toast('اتبعت: ' + f.name);
      } catch (e) { S.toast(S.friendly(e)); }
    }
    filesSig = ''; refreshFiles();
  }
  function wireDrop() {
    const d = $('drop'), p = $('pick'); if (!d) return;
    d.onclick = () => p.click(); p.onchange = () => { upload([...p.files]); p.value = ''; };
    ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('on'); }));
    ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('on'); }));
    d.addEventListener('drop', e => upload([...e.dataTransfer.files]));
  }
  async function download(fid) {
    try {
      const f = await C.fileGet(cid(), fid, tk()); if (!f) return;
      const bin = atob(f.b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type: f.mime })); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { S.toast(S.friendly(e)); }
  }

  // ---- تحويل الكلام لنص (اختياري، بموافقة الطرفين): متصفح كل طرف بيكتب كلامه هو بس، فمعروف مين قال إيه ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, txBuf = [], txFlushT = null, txNote = '', txDenied = false, txGap = false;
  const MYNAME = ROLE === 'client' ? 'الموكل' : 'المحامي';
  const txShouldRun = () => !!st && !!st.tx_on && ['accepted', 'live'].includes(st.status) && p2pOn && micOn && !txDenied;
  function txPush(t, k) { txBuf.push({ t, k: k || 'speech', at: Date.now() }); clearTimeout(txFlushT); txFlushT = setTimeout(txFlush, 4000); }
  async function txFlush() {
    if (!txBuf.length || !st) return; const take = txBuf.splice(0, 20), now = Date.now();
    try { await C.txPut(cid(), tk(), take.map(x => ({ t: x.t, k: x.k, ago: now - x.at }))); } catch { txBuf = take.concat(txBuf).slice(0, 100); }
    if (txBuf.length) { clearTimeout(txFlushT); txFlushT = setTimeout(txFlush, 4000); }
  }
  function txStart() {
    if (rec) return;
    if (!SR) { txNote = 'تحويل الكلام لنص مش متاح على متصفحك'; if (!txGap) { txGap = true; txPush('تحويل كلام ' + MYNAME + ' لنص غير متاح (المتصفح لا يدعم ذلك)، فالنص ناقص من جهته.', 'gap'); } return; }
    const r = new SR(); rec = r; r.lang = 'ar-EG'; r.continuous = true; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) { if (e.results[i].isFinal) { const t = String(e.results[i][0].transcript || '').trim(); if (t) txPush(t, 'speech'); } } };
    r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { txDenied = true; txNote = 'تحويل الكلام لنص متوقف (الميكروفون أو الخدمة غير مسموحة)'; txPush('تحويل كلام ' + MYNAME + ' لنص توقف (الصلاحية غير مسموحة)، فالنص ناقص من جهته.', 'gap'); } };
    r.onend = () => { if (rec === r) rec = null; if (txShouldRun()) setTimeout(txSync, 300); };
    try { r.start(); txNote = ''; } catch { rec = null; }
  }
  if (q.get('debug') === '1') { window.__t = window.__t || {}; window.__t.tx = () => ({ should: txShouldRun(), rec: !!rec, p2pOn, micOn, denied: txDenied, st: st && { s: st.status, tx: st.tx_on, joined: my('joined') } }); }
  function txStop() { if (rec) { const r = rec; rec = null; r.onend = null; try { r.stop(); } catch {} } txFlush(); }
  function txSync() { if (txShouldRun()) txStart(); else if (rec) txStop(); }

  // ---- طبقة التطبيق: قناة بيانات مباشرة بين الطرفين (سريعة)، وبديلها الإشارات عبر قاعدة البيانات ----
  const PEER = ROLE === 'client' ? 'lawyer' : 'client';
  function setupDc(ch) { dc = ch; ch.onmessage = e => { try { if (typeof e.data === 'string' && e.data.length < 6000) onApp(JSON.parse(e.data)); } catch {} }; ch.onclose = () => { if (dc === ch) dc = null; }; }
  const dcOpen = () => !!dc && dc.readyState === 'open';
  function appSend(o, opt) {
    if (dcOpen()) { try { dc.send(JSON.stringify(o)); return true; } catch {} }
    if (!(opt && opt.dcOnly) && peerSid) sig({ t: 'app', from: mySid, to: peerSid, d: o });
    return false;
  }
  function onApp(o) {
    if (!o || typeof o !== 'object') return;
    if (o.k === 'chat' && typeof o.body === 'string' && typeof o.mid === 'string') addMsg({ mid: o.mid.slice(0, 40), from: PEER, body: o.body.slice(0, 1000) });
    else if (o.k === 'open' && typeof o.id === 'string') openDoc(o.id, 'remote');
    else if (o.k === 'closedoc') closeDoc('remote');
    else if (o.k === 'scroll' && ROLE === 'client' && typeof o.y === 'number') { lastScrollY = Math.max(0, Math.min(1, o.y)); applyScroll(); }
    else if (o.k === 'ptr' && typeof o.x === 'number' && typeof o.y === 'number') showPtr(Math.max(0, Math.min(1, o.x)), Math.max(0, Math.min(1, o.y)));
    else if (o.k === 'hide') { const p = document.querySelector('#docbody .cs-ptr'); if (p) p.style.display = 'none'; }
  }

  // ---- عرض مشترك: مؤشر وتمرير ----
  let lastScrollY = null, ptrT = null, scrT = null, lastPtr = 0, lastScr = 0, syncing = false;
  function applyScroll() {
    const b = $('docbody'), f = $('follow'); if (!b || lastScrollY === null || ROLE !== 'client' || (f && !f.checked)) return;
    syncing = true; b.scrollTop = lastScrollY * Math.max(0, b.scrollHeight - b.clientHeight); setTimeout(() => { syncing = false; }, 60);
  }
  function showPtr(x, y) {
    const b = $('docbody'), d = $('docv'); if (!b || !d || d.hidden) return;
    let p = b.querySelector('.cs-ptr'); if (!p) { p = document.createElement('div'); p.className = 'cs-ptr'; p.innerHTML = '<i></i><span></span>'; b.appendChild(p); }
    p.querySelector('span').textContent = ROLE === 'client' ? 'المحامي' : 'الموكل';
    p.style.left = (x * b.scrollWidth) + 'px'; p.style.top = (y * b.scrollHeight) + 'px'; p.style.display = 'block';
    clearTimeout(ptrT); ptrT = setTimeout(() => { p.style.display = 'none'; }, 2500);
  }
  function sendScroll() { const b = $('docbody'); if (!b) return; const max = b.scrollHeight - b.clientHeight; appSend({ k: 'scroll', y: max > 0 ? b.scrollTop / max : 0 }); }
  function wireDoc() {
    const b = $('docbody'); if (!b) return;
    $('docsel').onchange = e => openDoc(e.target.value);
    if (ROLE === 'lawyer') $('followLbl').hidden = true; else $('follow').onchange = () => { if ($('follow').checked) applyScroll(); };
    b.addEventListener('pointermove', e => { const t = Date.now(); if (t - lastPtr < 40) return; lastPtr = t; const r = b.getBoundingClientRect(); appSend({ k: 'ptr', x: (e.clientX - r.left + b.scrollLeft) / Math.max(1, b.scrollWidth), y: (e.clientY - r.top + b.scrollTop) / Math.max(1, b.scrollHeight) }, { dcOnly: true }); });
    b.addEventListener('pointerleave', () => appSend({ k: 'hide' }, { dcOnly: true }));
    b.addEventListener('scroll', () => { if (ROLE !== 'lawyer' || syncing) return; const gap = dcOpen() ? 80 : 1500, t = Date.now(); clearTimeout(scrT); if (t - lastScr >= gap) { lastScr = t; sendScroll(); } else scrT = setTimeout(() => { lastScr = Date.now(); sendScroll(); }, gap); });
  }

  // ---- المحادثة ----
  const msgs = [], msgIds = new Set(); let tab = 'files', unread = 0, msgsLoaded = false;
  const linkify = h => h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  function beep() { try { const A = window.AudioContext || window.webkitAudioContext, c = new A(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.04; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.12); setTimeout(() => c.close(), 400); } catch {} }
  function updBadge() { const b = $('chatBadge'); if (b) { b.hidden = !unread; b.textContent = unread; } }
  function addMsg(m, quiet) {
    if (msgIds.has(m.mid)) return; msgIds.add(m.mid); msgs.push(m); renderChat();
    if (m.from !== ROLE && !quiet) { if (tab !== 'chat') { unread++; updBadge(); } beep(); }
  }
  function renderChat() {
    const l = $('chatlog'); if (!l) return; const atEnd = l.scrollHeight - l.scrollTop - l.clientHeight < 50;
    l.innerHTML = msgs.length ? msgs.map(m => `<div class="cs-msg ${m.from === ROLE ? 'me' : 'them'}" dir="auto">${linkify(esc(m.body))}</div>`).join('') : '<small style="color:var(--muted-foreground);margin:auto">ابدأ المحادثة هنا. الرسائل بتتحفظ لحد انتهاء مهلة الاعتراض.</small>';
    if (atEnd) l.scrollTop = l.scrollHeight;
  }
  function setTab(t) {
    tab = t; ['files', 'chat', 'notes'].forEach(k => { const p = $('pane-' + k); if (p) p.hidden = k !== t; const b = document.querySelector('[data-tab="' + k + '"]'); if (b) b.classList.toggle('on', k === t); });
    if (t === 'chat') { unread = 0; updBadge(); const l = $('chatlog'); if (l) l.scrollTop = l.scrollHeight; const i = $('chatin'); if (i) i.focus(); }
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'chatform') return; e.preventDefault();
    const i = $('chatin'), body = i.value.trim(); if (!body || !st) return; i.value = '';
    const mid = 'm' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-4);
    addMsg({ mid, from: ROLE, body }); appSend({ k: 'chat', mid, body }, { dcOnly: true });
    try { await C.msgSend(cid(), tk(), body, mid); } catch (er) { S.toast(S.friendly(er)); }
  });

  // ---- ملاحظات المحامي وملخص الموكل ----
  let summaryText = '', summarySent = false, notesLoaded = false, notesT = null, sumTried = false;
  const notesHtml = () => `<small>الملاحظات دي ليك لوحدك، الموكل ما بيشوفهاش.</small><label for="notes">ملاحظاتي (بتتحفظ لوحدها)</label><textarea id="notes" rows="5" maxlength="6000" placeholder="نقاط تفتكرها من الاستشارة..."></textarea>
    <label for="summary">ملخص للموكل</label><small>اكتب ملخص واضح للاستشارة (التوصية والخطوات الجاية). بيتبعت للموكل ومش بيتعدّل بعد الإرسال، وفريق المنصة بيرجعله لو حصل اعتراض.</small>
    <textarea id="summary" rows="6" maxlength="4000" placeholder="مثال: راجعنا عقد الإيجار، والبند الخامس محتاج تعديل..."></textarea>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><button type="button" id="sumSend">ابعت الملخص للموكل</button><span id="sumState" style="font-size:12.5px;color:#15803D;font-weight:700"></span></div>`;
  function lockSummary() { const t = $('summary'), b = $('sumSend'), s = $('sumState'); if (t) { t.value = summaryText; t.disabled = true; } if (b) b.hidden = true; if (s) s.textContent = '✓ اتبعت للموكل'; }
  async function loadNotes() {
    try { const n = await C.notesGet(cid()); notesLoaded = true; if ($('notes')) $('notes').value = n.notes; if ($('summary')) $('summary').value = n.summary; if (n.summary_sent_at) { summarySent = true; summaryText = n.summary; lockSummary(); updateSum(); } } catch {}
  }
  async function saveNotesNow() { if (!notesLoaded || !$('notes')) return; try { await C.notesSave(cid(), $('notes').value, summarySent ? '' : $('summary').value); } catch {} }
  function wireNotes() {
    notesLoaded = false; summarySent = !!summaryText && ROLE === 'lawyer'; loadNotes();
    const soon = () => { clearTimeout(notesT); notesT = setTimeout(saveNotesNow, 1200); };
    $('notes').oninput = soon; $('summary').oninput = soon;
    $('sumSend').onclick = async () => {
      const t = $('summary').value.trim(); if (t.length < 20) return S.toast('الملخص لازم يكون 20 حرف على الأقل');
      if (!confirm('الملخص هيتبعت للموكل ومش هتقدر تعدّله بعد كده. تبعت؟')) return;
      try { await C.notesSave(cid(), $('notes').value, t); await C.summarySend(cid(), t); summarySent = true; summaryText = t; lockSummary(); updateSum(); S.toast('الملخص اتبعت للموكل'); } catch (er) { S.toast(S.friendly(er)); }
    };
  }
  function sumHtml() {
    if (!summaryText) return '';
    return `<div class="cs-sum"><b>${ROLE === 'client' ? 'ملخص الاستشارة من المحامي' : 'الملخص اللي اتبعت للموكل'}</b><pre dir="auto">${esc(summaryText)}</pre><button type="button" data-a="sumdl">تحميل</button><button type="button" data-a="sumprint">طباعة</button></div>`;
  }
  function updateSum() { const b = $('sumBox'); if (b) b.innerHTML = sumHtml(); }
  async function refreshExtras() {
    const s = st.status; if (!['accepted', 'live', 'awaiting_confirm', 'disputed', 'released'].includes(s)) return;
    if (['accepted', 'live', 'awaiting_confirm'].includes(s) && $('chatlog')) { try { const l = await C.msgs(cid(), tk()), first = !msgsLoaded; msgsLoaded = true; l.forEach(m => addMsg({ mid: m.mid, from: m.from, body: m.body }, first)); } catch {} }
    if (ROLE === 'client' && !summaryText && !(FINAL.includes(s) && sumTried)) {
      sumTried = FINAL.includes(s);
      try { const x = await C.summaryGet(cid(), tk()); if (x && x.summary) { summaryText = x.summary; S.toast('المحامي بعتلك ملخص الاستشارة'); updateSum(); } } catch {}
    }
  }

  // ---- ساحة عرض المستندات: أي مستند يتضاف بيتفتح عند الطرفين من غير تحميل ----
  let viewerId = null, viewTok = 0, knownIds = null, curUrl = null; const docCache = {}, libs = {};
  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFW = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
  const loadLib = (k, url) => libs[k] || (libs[k] = new Promise((res, rej) => { const el = document.createElement('script'); el.src = url; el.onload = res; el.onerror = () => { delete libs[k]; rej(new Error('lib')); }; document.head.appendChild(el); }));
  function onFilesChanged(l) {
    const ids = l.map(f => f.id);
    if (knownIds === null) { knownIds = new Set(ids); return; }
    const fresh = l.filter(f => !knownIds.has(f.id)); ids.forEach(i => knownIds.add(i));
    if (fresh.length && $('docv')) { const f = fresh[fresh.length - 1]; if (f.uploader !== ROLE) { S.toast('الطرف التاني بعت مستند: ' + f.name); beep(); } openDoc(f.id, 'auto'); }
    else if (viewerId && !ids.includes(viewerId)) closeDoc();
    if (viewerId) fillSel();
  }
  function fillSel() { const sel = $('docsel'); if (!sel) return; sel.innerHTML = fileList.map(f => `<option value="${esc(f.id)}"${f.id === viewerId ? ' selected' : ''}>${esc(f.name)}</option>`).join(''); sel.style.display = fileList.length > 1 ? '' : 'none'; }
  function closeDoc(mode) { if (!mode) appSend({ k: 'closedoc' }); viewerId = null; viewTok++; if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; } const g = $('roomgrid'); if (g) g.classList.remove('withdoc'); const d = $('docv'); if (d) d.hidden = true; const b = $('docbody'); if (b) b.innerHTML = ''; }
  async function openDoc(id, mode) {
    let meta = fileList.find(f => f.id === id);
    if (!meta && mode === 'remote') { await refreshFiles(); meta = fileList.find(f => f.id === id); }
    if (!meta || !$('docv')) return;
    if (!mode) appSend({ k: 'open', id });
    viewerId = id; const tok = ++viewTok;
    $('roomgrid').classList.add('withdoc'); $('docv').hidden = false; $('docname').textContent = meta.name; fillSel();
    const body = $('docbody'); body.className = 'cs-docbody'; body.innerHTML = '<div class="cs-dmsg">جاري فتح المستند...</div>';
    try {
      let d = docCache[id];
      if (!d) { const f = await C.fileGet(cid(), id, tk()); if (!f) throw new Error('x'); const bin = atob(f.b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); d = docCache[id] = { name: f.name, mime: f.mime, u8 }; }
      if (tok !== viewTok) return;
      await renderDoc(d, tok, body); applyScroll();
    } catch { if (tok === viewTok) body.innerHTML = `<div class="cs-dmsg">تعذّر عرض المستند هنا.<br><button type="button" data-a="dldoc">تحميل المستند</button></div>`; }
  }
  // تنظيف ناتج Word: بنبني عناصر آمنة بس ونتجاهل أي سكريبت أو خاصية، علشان مستند الموكل ما يقدرش ينفّذ كود عند المحامي
  const SAFE = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'BR', 'HR', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'SPAN', 'DIV', 'BLOCKQUOTE', 'SUP', 'SUB', 'IMG']), DROP = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'FORM', 'SVG', 'MATH', 'TEMPLATE', 'NOSCRIPT', 'TITLE', 'HEAD']);
  function cleanInto(src, dst) {
    for (const n of Array.from(src.childNodes)) {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.nodeValue));
      else if (n.nodeType === 1) {
        const t = n.tagName; if (DROP.has(t)) continue;
        if (!SAFE.has(t)) { cleanInto(n, dst); continue; }
        const e = document.createElement(t);
        if (t === 'IMG') { const u = n.getAttribute('src') || ''; if (!/^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+\/=]+$/i.test(u)) continue; e.src = u; e.alt = ''; }
        if (t === 'TD' || t === 'TH') ['colspan', 'rowspan'].forEach(k => { const v = parseInt(n.getAttribute(k), 10); if (v > 0 && v < 50) e.setAttribute(k, String(v)); });
        if (/^(P|H[1-6]|LI)$/.test(t)) e.setAttribute('dir', 'auto');
        cleanInto(n, e); dst.appendChild(e);
      }
    }
  }
  if (q.get('debug') === '1') window.__t = Object.assign(window.__t || {}, { clean: h => { const d = document.createElement('div'); cleanInto(new DOMParser().parseFromString(h, 'text/html').body, d); return d.innerHTML; }  });
  async function renderDoc(d, tok, body) {
    if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
    if (d.mime === 'application/pdf') {
      await loadLib('pdf', PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW;
      const pdf = await window.pdfjsLib.getDocument({ data: d.u8.slice() }).promise; if (tok !== viewTok) return;
      body.innerHTML = ''; const w = Math.max(240, body.clientWidth - 24), n = Math.min(pdf.numPages, 40), dpr = Math.min(2, window.devicePixelRatio || 1);
      for (let i = 1; i <= n; i++) {
        const pg = await pdf.getPage(i); if (tok !== viewTok) return;
        const v0 = pg.getViewport({ scale: 1 }), sc = Math.min(2.5, w / v0.width), vp = pg.getViewport({ scale: sc * dpr });
        const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height); cv.style.width = Math.floor(vp.width / dpr) + 'px'; body.appendChild(cv);
        await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      }
      if (pdf.numPages > n) body.insertAdjacentHTML('beforeend', `<div class="cs-dmsg">اتعرضت أول ${n} صفحة. حمّل الملف لباقي الصفحات.</div>`);
    } else if (d.mime.startsWith('image/')) {
      curUrl = URL.createObjectURL(new Blob([d.u8], { type: d.mime })); body.innerHTML = ''; const im = document.createElement('img'); im.src = curUrl; im.alt = d.name; body.appendChild(im);
    } else if (d.mime === 'text/plain') {
      body.innerHTML = ''; const pre = document.createElement('pre'); pre.dir = 'auto'; pre.textContent = new TextDecoder('utf-8').decode(d.u8); body.appendChild(pre);
    } else if (d.mime.includes('wordprocessingml')) {
      await loadLib('mammoth', MAMMOTH);
      const r = await window.mammoth.convertToHtml({ arrayBuffer: d.u8.buffer.slice(d.u8.byteOffset, d.u8.byteOffset + d.u8.byteLength) }); if (tok !== viewTok) return;
      body.innerHTML = ''; const box = document.createElement('div'); box.className = 'cs-docx'; cleanInto(new DOMParser().parseFromString(r.value, 'text/html').body, box); body.appendChild(box);
    } else {
      body.innerHTML = `<div class="cs-dmsg">المعاينة مش متاحة لنوع الملف ده (Word القديم).<br><button type="button" data-a="dldoc">تحميل المستند</button></div>`;
    }
  }

  // ---- أزرار ----
  let busy = false;
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b || busy || !st) return;
    const a = b.dataset.a; busy = true;
    try {
      if (a === 'accept') await C.respond(CID, true);
      else if (a === 'reject') { if (confirm('ترفض الطلب؟')) await C.respond(CID, false); }
      else if (a === 'consent') await C.consent(cid(), tk(), true);
      else if (a === 'cancel') { if (confirm('تلغي الاستشارة؟ هيتردّ المبلغ بالكامل.')) await C.end(cid(), tk()); }
      else if (a === 'end') { if (confirm('تنهي الاستشارة؟' + (ROLE === 'lawyer' && !summarySent ? '\n(لسه ما بعتش ملخص للموكل، هتقدر تكتبه بعد الإنهاء.)' : ''))) { await C.end(cid(), tk()); } }
      else if (a === 'confirm') await C.confirm(TOKEN);
      else if (a === 'problem') $('prob').hidden = false;
      else if (a === 'dispute') { const r = $('reason').value.trim(); if (r.length < 5) S.toast('اكتب المشكلة بجملة واضحة'); else await C.dispute(TOKEN, r); }
      else if (a === 'dl') await download(b.dataset.f);
      else if (a === 'view') await openDoc(b.dataset.f);
      else if (a === 'dldoc') { if (viewerId) await download(viewerId); }
      else if (a === 'closedoc') closeDoc();
      else if (a === 'sumdl') { const head = 'ملخص استشارة - ليجانو\n' + (ROLE === 'client' && st.lawyer ? 'المحامي: ' + st.lawyer.name + '\n' : '') + new Date().toLocaleDateString('ar-EG') + '\n\n'; const u = URL.createObjectURL(new Blob(['\ufeff' + head + summaryText], { type: 'text/plain;charset=utf-8' })); const l = document.createElement('a'); l.href = u; l.download = 'legano-consultation-summary.txt'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); }
      else if (a === 'sumprint') { const w = window.open('', '_blank'); if (!w) S.toast('اسمح بالنوافذ المنبثقة علشان تطبع'); else { w.document.write('<!doctype html><meta charset="utf-8"><title>ملخص الاستشارة</title><body dir="rtl" style="font-family:Tahoma,sans-serif;padding:24px;line-height:2"><h2>ملخص الاستشارة - ليجانو</h2><pre style="white-space:pre-wrap;font-family:inherit">' + esc(summaryText) + '</pre>'); w.document.close(); w.focus(); w.print(); } }
    } catch (er) { S.toast(S.friendly(er)); }
    busy = false; tick();
  });
  await tick();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
