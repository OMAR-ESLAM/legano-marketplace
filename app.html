<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff">
<title>ليجانو</title>
<script>
// بوابة فتح التطبيق: المحامي للمنشورات، الموكل لحسابه، والزائر للرئيسية
(function () {
  var to = 'index.html?browse=1';
  try {
    var l = JSON.parse(localStorage.getItem('lg_s') || 'null'), c = JSON.parse(localStorage.getItem('lg_c') || 'null');
    if (l && l.access_token) to = 'feed.html?src=pwa';
    else if (c && c.access_token) to = 'account.html?src=pwa';
  } catch (e) {}
  location.replace(to);
})();
</script></head>
<body style="font-family:sans-serif;background:#fff"><noscript><a href="index.html">ليجانو</a></noscript></body></html>
